const lines = rawData
  .split("\n")
  .map(line => line.trim())
  .filter(Boolean);

const grouped = {};
let currentPoint = "";

lines.forEach(line => {
  if (line.includes("pt")) {
    currentPoint = line;

    if (!grouped[currentPoint]) {
      grouped[currentPoint] = [];
    }
  } else {
    grouped[currentPoint].push(line);
  }
});

const content = document.getElementById("content");
const searchInput = document.getElementById("search");
  <!-- 既存script内の searchInput の下に追加 -->

const typeFilter = document.getElementById("typeFilter");
const showUncheckedOnly =
  document.getElementById("showUncheckedOnly");

/* 開閉状態保存 */
let sectionStates = JSON.parse(
  localStorage.getItem("xp-buff-sections") || "{}"
);

let checkedItems = JSON.parse(
  localStorage.getItem("xp-buff-checklist") || "{}"
);

function saveChecklist() {
  localStorage.setItem(
    "xp-buff-checklist",
    JSON.stringify(checkedItems)
  );
}

function updateProgress() {

  const totalItems = Object.values(grouped)
    .reduce((sum, arr) => sum + arr.length, 0);

  let checkedCount = 0;

  Object.entries(grouped).forEach(([point, entries]) => {

    entries.forEach(entry => {

      const key = `${point}-${entry}`;

      if (checkedItems[key]) {
        checkedCount++;
      }

    });

  });

  const progress = totalItems
    ? Math.round((checkedCount / totalItems) * 100)
    : 0;

  document.getElementById("progressText").textContent =
    `${checkedCount} / ${totalItems} (${progress}%)`;

  document.getElementById("progressBar").style.width =
    `${progress}%`;
}

  
  let checked = 0;

  items.forEach(item => {

    const key =
      `${item.point}-${item.name}`;

    if (checkedItems[key]) {
      checked++;
    }

  });

  const percent = total > 0
    ? Math.round((checked / total) * 100)
    : 0;

  document.getElementById("progressText").textContent =
    `${checked} / ${total} (${percent}%)`;

  document.getElementById("progressBar").style.width =
    `${percent}%`;
}

  const progress = totalItems
    ? Math.round((checkedCount / totalItems) * 100)
    : 0;

  document.getElementById("progressText").textContent =
    `${checkedCount} / ${totalItems} (${progress}%)`;

  document.getElementById("progressBar").style.width =
    `${progress}%`;
}

/* render() を丸ごと置き換え */

function render() {

  const search = searchInput.value.toLowerCase();
  const selectedType = typeFilter.value;
  const uncheckedOnly = showUncheckedOnly.checked;

  content.innerHTML = "";

  Object.entries(grouped).forEach(([point, entries]) => {

    let filtered = entries.filter(entry => {

      const matchesSearch =
        entry.toLowerCase().includes(search);

      const matchesType =
        selectedType === "all"
          ? true
          : entry.startsWith(selectedType);

      const matchesUnchecked =
        uncheckedOnly
          ? !checkedItems[`${point}-${entry}`]
          : true;

      return (
        matchesSearch &&
        matchesType &&
        matchesUnchecked
      );
    });

    if (filtered.length === 0) return;

    /* ポイント別進捗 */
    const total = entries.length;

   const checked = entries.filter(
  item => checkedItems[`${point}-${item}`]
).length;

    const percent = total
      ? Math.round((checked / total) * 100)
      : 0;

    /* 初期状態 */
    let isOpen;

    if (sectionStates[point] !== undefined) {
      isOpen = sectionStates[point];
    } else {
      isOpen = point === "100pt";
    }

    const section = document.createElement("div");

    section.innerHTML = `
      <details
        class="border rounded-2xl bg-slate-50 overflow-hidden"
        ${isOpen ? "open" : ""}
        data-point="${point}"
      >

        <summary
          class="cursor-pointer list-none px-5 py-4 hover:bg-slate-100 transition"
        >

          <div class="flex justify-between items-center">

            <div>
              <div class="text-xl font-bold text-blue-600">
                ${point}
              </div>

              <div class="text-sm text-slate-500 mt-1">
                ${checked} / ${total} (${percent}%)
              </div>
            </div>

            <div class="text-sm text-slate-500">
              ${filtered.length}件
            </div>

          </div>

          <!-- ポイント別進捗バー -->
          <div class="w-full h-3 bg-white rounded-full overflow-hidden mt-3">

            <div
              class="h-3 bg-blue-500 transition-all duration-300"
              style="width:${percent}%"
            ></div>

          </div>

        </summary>

        <div class="p-4 border-t">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

            ${filtered.map(entry => `

              <label
                class="flex items-center gap-3 bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition"
              >

                <input
                  type="checkbox"
                  class="w-5 h-5"
                  ${checkedItems[`${point}-${entry}`] ? "checked" : ""}
                  data-item="${point}-${entry}"
                />

                <span class="${
                  checkedItems[`${point}-${entry}`]
                    ? "line-through text-slate-400"
                    : "text-slate-700"
                }">

                  ${entry}

                </span>

              </label>

            `).join("")}

          </div>

        </div>

      </details>
    `;

    content.appendChild(section);
  });

  /* チェックボックス保存 */
  document.querySelectorAll(
    "input[type=checkbox][data-item]"
  ).forEach(box => {

    box.addEventListener("change", (e) => {

      const item = e.target.dataset.item;

      checkedItems[item] = e.target.checked;

      saveChecklist();

      render();
      updateProgress();
    });
  });

  /* 開閉状態保存 */
  document.querySelectorAll("details").forEach(detail => {

    detail.addEventListener("toggle", () => {

      const point = detail.dataset.point;

      sectionStates[point] = detail.open;

      localStorage.setItem(
        "xp-buff-sections",
        JSON.stringify(sectionStates)
      );
    });
  });

  updateProgress();
}

searchInput.addEventListener("input", render);

  /* 一番下に追加 */

typeFilter.addEventListener("change", render);

showUncheckedOnly.addEventListener(
  "change",
  render
);
  
  render();
  
</script>
